#
# meta-hailo-6.18 minimal distro conf (DISTRO="hailo")
#
# wrynose 6.0 트리에는 nodistro.conf/meta-poky가 없어 bitbake.conf의
#   include conf/distro/${DISTRO}.conf
# 가 로드할 distro conf를 레이어에서 공급한다.
#
# wrynose meta/conf/distro/defaultsetup.conf는 항상 자동 include 되므로
# (PACKAGE_CLASSES/INHERIT_DISTRO/uninative 등 기본값 제공) 이 파일은
# defaultsetup가 require하는 TCMODE/TCLIBC만 명시하면 된다.
#
# bitbake.conf: DISTRO ??= "nodistro" (기본값 존재하지만 nodistro conf 없음)
# bitbake.conf: TCMODE ??= "default", TCLIBC ??= "glibc"

# defaultsetup.conf가 require conf/distro/include/tcmode-${TCMODE}.inc,
# require conf/distro/include/tclibc-${TCLIBC}.inc 하므로 값 고정.
TCMODE = "default"
TCLIBC = "glibc"

# 패키지 포맷: wrynose meta/classes-global에 package_ipk/deb/rpm 실재.
# 커널 단독 검증 목적에서는 포맷이 거의 영향 없음 (ipk 기본 유지).
PACKAGE_CLASSES ?= "package_ipk"

# DISTRO_FEATURES 최소화: Hailo EVB VPU 머신은 display/audio/x11 등
# full desktop을 요구하지 않는다. kernel 단독 빌드 검증 목적이므로
# 불필요한 virtual provider(xserver 등)를 피한다.
DISTRO_FEATURES:remove = "x11 opengl pam bluetooth pulseaudio gobject-introspection-data wayland"
DISTRO_FEATURES:remove = "zeroconf 3g nfc xattr vfat"

# 이미지 빌드 시 필요하지 않은 이미지 특화 기능 비활성
IMAGE_FEATURES ?= ""
DISTRO_EXTRA_RDEPENDS ?= ""
DISTRO_EXTRA_RRECOMMENDS ?= ""
