#
# Hailo15 EVB (2-camera, VPU) machine - wrynose 6.0
#
# 1.12.1 meta-hailo-soc machine conf 체인(hailo1x-base.inc)의
# fitImage/u-boot-tfa.itb/SCU fw 시그니처 설정을 배제하고,
# 커널 단독 검증에 필요한 최소 machine 변수만 재구성.
#
# tune 체인 (wrynose 표준 aarch64):
#   require conf/machine/include/arm/arch-arm64.inc
#     -> arch-armv7ve.inc
#     DEFAULTTUNE ?= "aarch64"  (plain aarch64, -mcpu 없음)
#     TUNE_FEATURES:tune-aarch64 = "aarch64"
#   bitbake.conf:
#     TUNE_FEATURES ??= "${TUNE_FEATURES:tune-${DEFAULTTUNE}}" -> "aarch64"
#     TUNE_ARCH = aarch64  ->  TARGET_ARCH = "${TUNE_ARCH}" = aarch64
#   kernel-arch.bbclass: aarch64 -> ARCH=arm64
#
# plain aarch64(아무 -mcpu 없음)로 고정한 이유: 검증된 159MB vmlinux가
# `make ARCH=arm64`(cortex-a57 같은 -mcpu 없이)로 만들어졌고, arch-arm64.inc
# 체인은 -mcpu를 추가하지 않아 그 빌드와 조건이 동일하다.
# (arch-armv8a/cortexa57 체인은 -mcpu=cortex-a57을 붙여 빌드 조건이 달라진다.)
#
#@TYPE: Machine
#@NAME: Hailo15 EVB (2 camera, VPU)
#@DESCRIPTION: Hailo-15 EVB 2-camera VPU machine (wrynose, 커널 단독 검증용)

require conf/machine/include/arm/arch-arm64.inc

# Hailo SoC명 (SCU/BL 등 하위 레시피 참조. 커널 단독 빌드에서는 미사용)
HAILO_SOC_NAME = "hailo15"

# 1.12.1 hailo1x-base.inc와 동일 (커널 단독 빌드에서는 참조 안 함)
SERIAL_CONSOLES = "115200;ttyS1"

# virtual/kernel provider = 이 레이어의 linux-yocto-hailo
# (wrynose 기본 linux-yocto가 kmeta/kgit 원격 의존성이 있어 불가)
PREFERRED_PROVIDER_virtual/kernel = "linux-yocto-hailo"

# 최소 rootfs에도 Hailo PHY와 USB 로더 모듈 및 의존 모듈을 설치한다.
MACHINE_ESSENTIAL_EXTRA_RDEPENDS += " \
    kernel-module-phy-hailo-torrent \
    kernel-module-usb-f-hailo-rfs-load \
    kernel-module-usb-f-hailo-swu-load \
    kernel-module-g-hailo \
"
