#
# meta-hailo-6.18 - Hailo15 커널 6.18 Yocto 레이어 (wrynose 6.0)
#
# 레시피: recipes-kernel/linux/linux-yocto-hailo_6.18.bb
# 빌드 대상 소스 트리 = 이 저장소 루트의 kernel/ 디렉터리 (외부 트리, externalsrc 인-트리 빌드)
#
# conf 공급:
#  - conf/distro/hailo.conf : wrynose에 nodistro/meta-poky가 없어 필요, DISTRO="hailo"
#  - conf/machine/hailo15-evb-2-camera-vpu.conf : Hailo EVB 머신
# bitbake가 BBPATH 검색으로 conf/distro/${DISTRO}.conf·conf/machine/${MACHINE}.conf를
# 로드하므로, 레이어 LAYERDIR을 BBPATH에 추가 (core layer와 동일 방식).
#
SUMMARY = "Hailo15 kernel 6.18 for wrynose"

# conf/distro, conf/machine, conf/layer.conf를 BBPATH에서 찾게 함
BBPATH .= ":${LAYERDIR}"

# 레시피 (core와 동일하게 recipes-*/*/*.bb)
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb"

BBFILE_COLLECTIONS += "hailo"
BBFILE_PATTERN_hailo = "^${LAYERDIR}/"
BBFILE_PRIORITY_hailo = "20"

# wrynose 6.0 코어와 호환 (meta/conf/layer.conf: LAYERSERIES_COMPAT_core = "wrynose")
LAYERSERIES_COMPAT_hailo = "wrynose"

# wrynose core(=poky meta)에만 의존
LAYERDEPENDS_hailo = "core"
